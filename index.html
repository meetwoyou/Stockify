<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, visual-viewport-fit=cover">
    <title>Stockify Pro - Hybrid Inventory</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#16a34a', background: '#f8fafc', darkBg: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .glass-effect { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .dark .glass-effect { background: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen pb-20 md:pb-0 md:pl-64 transition-colors duration-200">

    <aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-4 flex-col justify-between z-40">
        <div class="space-y-6">
            <div class="flex items-center px-2 py-3">
                <span class="text-2xl font-black tracking-tighter text-green-600 dark:text-green-500">STOCKIFY<span class="text-slate-400 text-xs ml-1">PRO</span></span>
            </div>
            <nav class="space-y-1">
                <button onclick="switchPage('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold text-green-600 bg-green-50 dark:bg-green-500/10" data-page="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="switchPage('products')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-500 dark:text-slate-400" data-page="products">
                    <i data-lucide="box" class="w-5 h-5"></i> Products
                </button>
                <button onclick="switchPage('scanner')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-500 dark:text-slate-400" data-page="scanner">
                    <i data-lucide="scan-line" class="w-5 h-5"></i> Scanner
                </button>
                <button onclick="switchPage('settings')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-500 dark:text-slate-400" data-page="settings">
                    <i data-lucide="settings" class="w-5 h-5"></i> Settings
                </button>
            </nav>
        </div>
        <div class="border-t border-slate-100 dark:border-slate-700 pt-4">
            <button onclick="toggleTheme()" class="w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-900/50">
                <span class="text-xs font-bold">Appearance</span>
                <i data-lucide="sun" class="w-4 h-4 text-amber-400 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 text-slate-400 dark:hidden"></i>
            </button>
        </div>
    </aside>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 glass-effect border-t border-slate-200 dark:border-slate-700 flex items-center justify-around z-50 px-2">
        <button onclick="switchPage('dashboard')" class="mobile-nav-btn flex flex-col items-center gap-1 text-green-600 flex-1" data-page="dashboard">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] font-bold">Dashboard</span>
        </button>
        <button onclick="switchPage('products')" class="mobile-nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1" data-page="products">
            <i data-lucide="box" class="w-5 h-5"></i><span class="text-[10px] font-bold">Products</span>
        </button>
        <button onclick="switchPage('scanner')" class="mobile-nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1" data-page="scanner">
            <i data-lucide="scan-line" class="w-5 h-5"></i><span class="text-[10px] font-bold">Scanner</span>
        </button>
        <button onclick="switchPage('settings')" class="mobile-nav-btn flex flex-col items-center gap-1 text-slate-400 flex-1" data-page="settings">
            <i data-lucide="settings" class="w-5 h-5"></i><span class="text-[10px] font-bold">Settings</span>
        </button>
    </nav>

    <main class="p-4 md:p-8 max-w-7xl mx-auto w-full">
        
        <section id="page-dashboard" class="page-view space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <h1 class="text-2xl font-black">Overview</h1>
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-widest">Hybrid Sync Enabled</p>
                </div>
                <div class="p-2 bg-green-500/10 rounded-lg"><i data-lucide="refresh-cw" class="w-4 h-4 text-green-500"></i></div>
            </div>
            <div class="grid gap-4 grid-cols-2 lg:grid-cols-3">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Total Items</p>
                    <h3 id="dash-total" class="text-2xl font-black mt-1">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Total Stock</p>
                    <h3 id="dash-pieces" class="text-2xl font-black mt-1 text-amber-500">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-sm col-span-2 lg:col-span-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Expired</p>
                    <h3 id="dash-expired" class="text-2xl font-black mt-1 text-red-500">0</h3>
                </div>
            </div>
        </section>

        <section id="page-products" class="page-view space-y-6 hidden">
            <div id="products-list-view" class="space-y-6">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-black">Inventory</h1>
                    <button onclick="openAddProductForm()" class="bg-green-600 text-white p-3 rounded-2xl shadow-lg shadow-green-600/20 active:scale-90 transition-transform">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="flex gap-3 bg-white dark:bg-slate-800 p-2 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="absolute left-3 top-3 h-4 w-4 text-slate-400"></i>
                        <input id="search-input" oninput="renderProducts()" type="text" placeholder="Search product..." class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none ring-1 ring-slate-100 dark:ring-slate-700">
                    </div>
                </div>

                <div id="product-grid" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                    </div>
            </div>

            <div id="products-form-view" class="max-w-xl mx-auto hidden animate-in fade-in slide-in-from-bottom-4">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="closeProductForm()" class="w-10 h-10 border border-slate-200 dark:border-slate-700 rounded-2xl flex items-center justify-center bg-white dark:bg-slate-800"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                    <h1 id="form-title" class="text-xl font-black uppercase">Product Entry</h1>
                </div>

                <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
                    <input type="hidden" id="form-id">
                    
                    <div class="relative group rounded-[2.5rem] overflow-hidden bg-slate-100 dark:bg-slate-900 border-2 border-dashed border-slate-200 dark:border-slate-700 aspect-video flex items-center justify-center">
                        <img id="form-img-output" class="absolute inset-0 w-full h-full object-cover hidden">
                        <div id="image-placeholder" class="text-center">
                            <i data-lucide="camera" class="w-8 h-8 text-slate-300 mx-auto"></i>
                            <p class="text-[10px] font-black text-slate-400 mt-2 uppercase">Tap to upload</p>
                        </div>
                        <input type="file" accept="image/*" onchange="handleFormImage(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                        <button type="button" onclick="removeFormImage()" id="remove-img-btn" class="absolute top-4 right-4 p-2 bg-black/50 text-white rounded-full hidden"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>

                    <div class="grid gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Product Name</label>
                            <input type="text" id="form-name" required class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none focus:ring-2 ring-green-500 transition-all font-bold">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">SKU / Barcode</label>
                                <input type="text" id="form-sku" required class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none font-mono text-sm">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Category</label>
                                <select id="form-category" class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none font-bold text-sm appearance-none">
                                    <option value="Grains">Grains</option>
                                    <option value="Dairy">Dairy</option>
                                    <option value="Beverages">Beverages</option>
                                    <option value="Snacks">Snacks</option>
                                    <option value="Toiletries">Toiletries</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2 bg-slate-50 dark:bg-slate-900/50 p-4 rounded-[2rem] border border-slate-200 dark:border-slate-700">
                            <div class="text-center">
                                <label class="text-[8px] font-black text-slate-400 uppercase">Cartons</label>
                                <input type="number" id="form-cartons" value="0" oninput="calculateTotalPieces()" class="bg-transparent w-full text-center font-black text-lg outline-none">
                            </div>
                            <div class="text-center">
                                <label class="text-[8px] font-black text-slate-400 uppercase">Pcs/Ctn</label>
                                <input type="number" id="form-pcs-per" value="1" oninput="calculateTotalPieces()" class="bg-transparent w-full text-center font-black text-lg outline-none">
                            </div>
                            <div class="text-center border-l border-slate-200 dark:border-slate-700">
                                <label class="text-[8px] font-black text-green-500 uppercase">Total Pcs</label>
                                <input type="number" id="form-total-pcs" readonly class="bg-transparent w-full text-center font-black text-lg text-green-500 outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Ctn Price (SAR)</label>
                                <input type="number" step="0.01" id="form-carton-price" oninput="calculatePrices('carton')" class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none font-bold">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Pcs Price (SAR)</label>
                                <input type="number" step="0.01" id="form-piece-price" oninput="calculatePrices('piece')" class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none font-bold">
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Expiry Date</label>
                            <input type="date" id="form-expiry" required class="w-full p-4 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl outline-none font-bold uppercase text-xs">
                        </div>
                    </div>

                    <button type="submit" id="save-btn" class="w-full bg-green-600 text-white py-5 rounded-[2rem] font-black uppercase tracking-widest shadow-xl shadow-green-600/20 active:scale-95 transition-all mt-4">
                        Sync to Cloud & Local
                    </button>
                </form>
            </div>
        </section>

        <section id="page-scanner" class="page-view space-y-6 hidden">
            <div class="max-w-md mx-auto space-y-6">
                <h1 class="text-2xl font-black">Fast Scan</h1>
                <div class="relative aspect-square rounded-[3rem] overflow-hidden border-4 border-green-500 bg-black shadow-2xl">
                    <div id="scanner-container" class="w-full h-full"></div>
                    <div class="absolute inset-0 border-[40px] border-black/40 pointer-events-none"></div>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-32 border-2 border-green-500 rounded-2xl animate-pulse"></div>
                </div>
                <p class="text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">Keep barcode inside the frame</p>
            </div>
        </section>

        <section id="page-settings" class="page-view space-y-6 hidden">
            <div class="bg-white dark:bg-slate-800 p-8 rounded-[3rem] border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <div class="relative w-24 h-24 mx-auto mb-4">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=YashKhan" class="rounded-full bg-slate-100 p-1 border-4 border-green-500">
                </div>
                <h2 class="text-2xl font-black">Yash Khan</h2>
                <p class="text-green-500 text-[10px] font-black uppercase tracking-widest mb-4">Lead Developer & Musician</p>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl">
                        <i data-lucide="cloud" class="w-5 h-5 mx-auto mb-1 text-slate-400"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Cloud Backup</p>
                        <p class="text-xs font-black text-green-500">Active</p>
                    </div>
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl">
                        <i data-lucide="database" class="w-5 h-5 mx-auto mb-1 text-slate-400"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase leading-none">Local DB</p>
                        <p class="text-xs font-black text-green-500">Synced</p>
                    </div>
                </div>

                <button onclick="toggleTheme()" class="w-full p-4 bg-slate-900 dark:bg-white dark:text-slate-900 text-white rounded-2xl font-black text-xs uppercase tracking-widest">
                    Switch Theme Mode
                </button>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
