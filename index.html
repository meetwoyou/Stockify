<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stockify Pro Ultra</title>

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SCANNER -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#16a34a",
                        darkBg: "#020617",
                        surface: "#0f172a"
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }

        body {
            font-family: Inter, sans-serif;
            background: #020617;
        }

        .glass {
            background: rgba(15, 23, 42, .75);
            backdrop-filter: blur(22px);
        }

        .page-view {
            animation: fade .35s ease;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .filter-chip.active {
            background: #16a34a;
            border-color: #16a34a;
            color: white;
        }
    </style>
</head>

<body class="text-white min-h-screen pb-28">

<main class="max-w-[1800px] mx-auto p-4 md:p-8 desktop-layout">

    <!-- SIDEBAR -->
    <aside class="hidden xl:block">
        <div class="glass border border-slate-800 rounded-[2.5rem] p-8 sticky top-8 shadow-2xl">

            <div class="flex items-center gap-4 mb-12">
                <div class="w-16 h-16 rounded-3xl bg-primary flex items-center justify-center">
                    <i data-lucide="package"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-black">Stockify</h1>
                    <p class="text-xs uppercase tracking-[0.35em] text-slate-500 font-black mt-1">PRO ULTRA</p>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="switchPage('dashboard')" class="nav-btn active">Dashboard</button>
                <button onclick="switchPage('products')" class="nav-btn">Products</button>
                <button onclick="switchPage('scanner')" class="nav-btn">AI Scanner</button>
                <button onclick="switchPage('settings')" class="nav-btn">Settings</button>
            </div>

        </div>
    </aside>

    <!-- CONTENT -->
    <section class="space-y-6">

        <!-- DASHBOARD -->
        <section id="page-dashboard" class="page-view">
            <div class="glass border border-slate-800 rounded-[2.8rem] p-6 md:p-8 shadow-2xl">

                <h1 class="text-4xl md:text-5xl font-black">Dashboard</h1>
                <p class="text-xs uppercase tracking-[0.3em] text-slate-500 mt-2">Smart Analytics System</p>

            </div>
        </section>

        <!-- PRODUCTS -->
        <section id="page-products" class="page-view hidden">
            <div class="glass border border-slate-800 rounded-[2.8rem] p-6 md:p-8 shadow-2xl">

                <h1 class="text-4xl md:text-5xl font-black">Products</h1>

                <input id="search-input" oninput="renderProducts()" placeholder="Search product..."
                    class="w-full mt-6 bg-slate-900 p-4 rounded-2xl border border-slate-800">

                <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6"></div>

            </div>
        </section>

        <!-- SCANNER -->
        <section id="page-scanner" class="page-view hidden">
            <div class="glass border border-slate-800 rounded-[2.8rem] p-8 text-center">
                <h1 class="text-5xl font-black">AI Scanner</h1>
                <div id="scanner-container" class="w-full h-64 bg-black mt-6 rounded-2xl"></div>
            </div>
        </section>

        <!-- SETTINGS -->
        <section id="page-settings" class="page-view hidden">
            <div class="glass border border-slate-800 rounded-[2.8rem] p-6 md:p-8 shadow-2xl">
                <h1 class="text-4xl font-black">Settings</h1>
                <button onclick="toggleTheme()" class="mt-6 bg-primary text-black px-5 py-3 rounded-xl font-black">
                    Toggle Theme
                </button>
            </div>
        </section>

    </section>

</main>

<!-- MOBILE NAV -->
<nav class="xl:hidden fixed bottom-0 left-0 right-0 glass border-t border-slate-800 h-24 flex justify-around items-center">
    <button onclick="switchPage('dashboard')">Home</button>
    <button onclick="switchPage('products')">Products</button>
    <button onclick="switchPage('scanner')">Scan</button>
    <button onclick="switchPage('settings')">Settings</button>
</nav>

<!-- APP -->
<script src="app.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
    });
</script>

</body>
</html>
