<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Stockify Ultra</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#22c55e',
                        darkbg: '#020617',
                        surface: '#0f172a'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: Inter, sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .page-view {
            animation: fade .3s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-chip.active {
            background: #22c55e;
            color: black;
        }
    </style>

</head>

<body class="bg-darkbg text-white min-h-screen pb-32">

    <!-- AUDIO -->
    <audio id="scan-sound">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"
            type="audio/mpeg">
    </audio>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto p-4 md:p-8">

        <!-- DASHBOARD -->
        <section id="page-dashboard"
            class="page-view hidden space-y-6">

            <div class="flex items-center justify-between">

                <div>
                    <h1 class="text-3xl md:text-5xl font-black">
                        Dashboard
                    </h1>

                    <p class="text-slate-500 text-sm mt-1">
                        Stockify Ultra Analytics
                    </p>
                </div>

                <button onclick="toggleTheme()"
                    class="bg-surface p-4 rounded-2xl border border-slate-800">

                    <i data-lucide="moon-star"></i>

                </button>

            </div>

            <!-- cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <div
                    class="bg-surface p-6 rounded-3xl border border-slate-800">

                    <p class="text-slate-500 text-xs uppercase">
                        Total Products
                    </p>

                    <h2 id="dash-total"
                        class="text-4xl font-black mt-3">
                        0
                    </h2>

                </div>

                <div
                    class="bg-red-500/10 border border-red-500/20 p-6 rounded-3xl">

                    <p class="text-red-400 text-xs uppercase">
                        Expired
                    </p>

                    <h2 id="dash-expired"
                        class="text-4xl font-black mt-3 text-red-400">
                        0
                    </h2>

                </div>

                <div
                    class="bg-yellow-500/10 border border-yellow-500/20 p-6 rounded-3xl">

                    <p class="text-yellow-400 text-xs uppercase">
                        Expiring 7 Days
                    </p>

                    <h2 id="dash-expiring"
                        class="text-4xl font-black mt-3 text-yellow-400">
                        0
                    </h2>

                </div>

                <div
                    class="bg-primary/10 border border-primary/20 p-6 rounded-3xl">

                    <p class="text-primary text-xs uppercase">
                        Categories
                    </p>

                    <h2 id="dash-category"
                        class="text-4xl font-black mt-3 text-primary">
                        0
                    </h2>

                </div>

            </div>

            <!-- charts -->
            <div class="grid md:grid-cols-2 gap-5">

                <div
                    class="bg-surface rounded-3xl p-6 border border-slate-800">

                    <h2 class="font-black text-xl mb-5">
                        Category Analytics
                    </h2>

                    <canvas id="chart1"></canvas>

                </div>

                <div
                    class="bg-surface rounded-3xl p-6 border border-slate-800">

                    <h2 class="font-black text-xl mb-5">
                        Expiry Analytics
                    </h2>

                    <canvas id="chart2"></canvas>

                </div>

            </div>

        </section>

        <!-- PRODUCTS -->
        <section id="page-products"
            class="page-view space-y-6">

            <div class="flex items-center justify-between">

                <div>

                    <h1
                        class="text-3xl md:text-5xl font-black">
                        Products
                    </h1>

                    <p class="text-slate-500 text-sm">
                        Manage inventory
                    </p>

                </div>

                <button onclick="openAddProductForm()"
                    class="bg-primary text-black p-5 rounded-3xl font-black active:scale-95">

                    <i data-lucide="plus"></i>

                </button>

            </div>

            <!-- search -->
            <div class="relative">

                <i data-lucide="search"
                    class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 w-5 h-5"></i>

                <input id="search-input"
                    oninput="renderProducts()"
                    type="text"
                    placeholder="Search product..."
                    class="w-full bg-surface border border-slate-800 rounded-3xl py-5 pl-14 pr-5 outline-none">

            </div>

            <!-- filter -->
            <div
                class="flex gap-3 overflow-x-auto no-scrollbar pb-2">

                <button onclick="setFilter('all')"
                    class="filter-chip active bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    All
                </button>

                <button onclick="setFilter('expired')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Expired
                </button>

                <button onclick="setFilter('expiring')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    7 Days Left
                </button>

                <button onclick="setFilter('Beverages')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Beverages
                </button>

                <button onclick="setFilter('Snacks')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Snacks
                </button>

                <button onclick="setFilter('Frozen')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Frozen
                </button>

                <button onclick="setFilter('Dairy')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Dairy
                </button>

                <button onclick="setFilter('Bakery')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Bakery
                </button>

                <button onclick="setFilter('Household')"
                    class="filter-chip bg-surface px-5 py-3 rounded-2xl whitespace-nowrap">
                    Household
                </button>

            </div>

            <!-- products -->
            <div id="product-grid"
                class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">

            </div>

        </section>

        <!-- SCANNER -->
        <section id="page-scanner"
            class="page-view hidden text-center space-y-6">

            <div>

                <h1 class="text-3xl font-black">
                    Smart Scanner
                </h1>

                <p class="text-slate-500 mt-2">
                    Scan barcode instantly
                </p>

            </div>

            <div
                class="max-w-lg mx-auto overflow-hidden rounded-[3rem] border-4 border-primary">

                <div id="scanner-container"
                    class="w-full aspect-square bg-black"></div>

            </div>

        </section>

        <!-- SETTINGS -->
        <section id="page-settings"
            class="page-view hidden max-w-3xl mx-auto">

            <div
                class="bg-surface border border-slate-800 rounded-[3rem] p-8 md:p-12 text-center">

                <img src="sabbir.jpg"
                    onerror="this.src='https://api.dicebear.com/7.x/adventurer/svg?seed=Sabbir'"
                    class="w-40 h-40 rounded-full object-cover mx-auto border-4 border-primary">

                <h1 class="text-4xl font-black mt-6">
                    Sabbir Hosen Akash
                </h1>

                <p class="text-primary mt-2 uppercase tracking-[5px] text-xs">
                    Developer
                </p>

                <div
                    class="grid md:grid-cols-2 gap-5 mt-10">

                    <button onclick="toggleTheme()"
                        class="bg-darkbg border border-slate-800 p-6 rounded-3xl text-left">

                        <h2 class="font-black text-xl">
                            Dark / Light
                        </h2>

                        <p class="text-slate-500 text-sm mt-2">
                            Toggle theme
                        </p>

                    </button>

                    <button onclick="window.location.reload()"
                        class="bg-darkbg border border-slate-800 p-6 rounded-3xl text-left">

                        <h2 class="font-black text-xl">
                            Restart App
                        </h2>

                        <p class="text-slate-500 text-sm mt-2">
                            Refresh Stockify
                        </p>

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- NAV -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-xl border-t border-slate-800 h-24 flex items-center justify-around z-50">

        <button onclick="switchPage('dashboard')"
            data-page="dashboard"
            class="nav-btn text-slate-500 flex flex-col items-center gap-1">

            <i data-lucide="layout-grid"></i>

            <span class="text-xs">
                Dashboard
            </span>

        </button>

        <button onclick="switchPage('products')"
            data-page="products"
            class="nav-btn text-primary flex flex-col items-center gap-1">

            <i data-lucide="package"></i>

            <span class="text-xs">
                Products
            </span>

        </button>

        <button onclick="switchPage('scanner')"
            data-page="scanner"
            class="nav-btn text-slate-500 flex flex-col items-center gap-1">

            <i data-lucide="scan-line"></i>

            <span class="text-xs">
                Scan
            </span>

        </button>

        <button onclick="switchPage('settings')"
            data-page="settings"
            class="nav-btn text-slate-500 flex flex-col items-center gap-1">

            <i data-lucide="settings-2"></i>

            <span class="text-xs">
                Settings
            </span>

        </button>

    </nav>

    <!-- ADD FORM -->
    <div id="products-form-view"
        class="hidden fixed inset-0 bg-darkbg z-[1000] overflow-y-auto">

        <div class="max-w-3xl mx-auto p-5 md:p-10">

            <div
                class="flex items-center justify-between mb-10">

                <h1 class="text-3xl font-black">
                    Product Form
                </h1>

                <button onclick="closeProductForm()"
                    class="bg-surface p-4 rounded-2xl">

                    <i data-lucide="x"></i>

                </button>

            </div>

            <form id="product-form"
                onsubmit="saveProduct(event)"
                class="space-y-5">

                <input type="hidden" id="form-id">

                <!-- image -->
                <div
                    class="bg-surface rounded-[3rem] overflow-hidden border border-slate-800">

                    <img id="form-img-output"
                        class="hidden w-full h-72 object-cover">

                    <input type="file"
                        accept="image/*"
                        onchange="handleFormImage(this)"
                        class="w-full p-10">

                </div>

                <input id="form-name"
                    type="text"
                    required
                    placeholder="Product Name"
                    class="w-full bg-surface p-6 rounded-3xl outline-none">

                <div class="grid md:grid-cols-2 gap-5">

                    <input id="form-sku"
                        type="text"
                        required
                        placeholder="Barcode"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                    <select id="form-category"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                        <option>Beverages</option>
                        <option>Snacks</option>
                        <option>Frozen</option>
                        <option>Dairy</option>
                        <option>Bakery</option>
                        <option>Household</option>

                    </select>

                </div>

                <div class="grid md:grid-cols-3 gap-5">

                    <input id="form-cartons"
                        type="number"
                        value="1"
                        oninput="calculateTotalPieces()"
                        placeholder="Cartons"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                    <input id="form-pcs-per"
                        type="number"
                        value="12"
                        oninput="calculateTotalPieces()"
                        placeholder="Pieces"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                    <input id="form-total-pcs"
                        readonly
                        placeholder="Total"
                        class="w-full bg-primary/10 text-primary p-6 rounded-3xl outline-none">

                </div>

                <div class="grid md:grid-cols-2 gap-5">

                    <input id="form-carton-price"
                        type="number"
                        step="0.01"
                        oninput="calculatePrices('carton')"
                        placeholder="Carton Price"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                    <input id="form-piece-price"
                        type="number"
                        step="0.01"
                        oninput="calculatePrices('piece')"
                        placeholder="Piece Price"
                        class="w-full bg-surface p-6 rounded-3xl outline-none">

                </div>

                <input id="form-expiry"
                    type="date"
                    required
                    class="w-full bg-surface p-6 rounded-3xl outline-none">

                <button
                    class="w-full bg-primary text-black font-black py-6 rounded-3xl text-xl">

                    Save Product

                </button>

            </form>

        </div>

    </div>

    <!-- SCAN RESULT -->
    <div id="scan-result-modal"
        class="hidden fixed inset-0 bg-black/80 backdrop-blur-xl z-[2000] items-center justify-center p-4">

        <div
            class="bg-surface max-w-md w-full rounded-[3rem] overflow-hidden border border-slate-800">

            <img id="scan-product-image"
                class="w-full h-72 object-cover">

            <div class="p-6 space-y-4">

                <div>

                    <h1 id="scan-product-name"
                        class="text-3xl font-black">
                    </h1>

                    <p id="scan-product-category"
                        class="text-primary mt-1">
                    </p>

                </div>

                <div class="space-y-3 text-sm">

                    <div class="flex justify-between">
                        <span>Barcode</span>
                        <span id="scan-product-sku"></span>
                    </div>

                    <div class="flex justify-between">
                        <span>Stock</span>
                        <span id="scan-product-stock"></span>
                    </div>

                    <div class="flex justify-between">
                        <span>Expiry</span>
                        <span id="scan-product-expiry"></span>
                    </div>

                    <div class="flex justify-between">
                        <span>Carton Price</span>
                        <span id="scan-product-carton"></span>
                    </div>

                    <div class="flex justify-between">
                        <span>Piece Price</span>
                        <span id="scan-product-piece"></span>
                    </div>

                </div>

                <button onclick="closeScanModal()"
                    class="w-full bg-primary text-black py-5 rounded-2xl font-black">

                    Close

                </button>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="app.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
