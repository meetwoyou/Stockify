<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, visual-viewport-fit=cover">
    <title>Stockify - Premium Inventory Solution</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981',
                        secondary: '#3b82f6',
                        darkPrimary: '#059669',
                        darkBg: '#0f172a',
                        cardBg: '#ffffff',
                        darkCardBg: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Hind Siliguri', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        .page-view { transition: opacity 0.3s ease, transform 0.3s ease; }
        .page-view.hidden { opacity: 0; transform: translateY(10px); pointer-events: none; }
        
        .glass-nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.8); }

        .active-nav { background: #10b981 !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2); }
        
        /* Skeleton loading animation */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .animate-skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen pb-20 md:pb-0 md:pl-64 transition-colors duration-300">

    <aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-6 flex-col justify-between z-40">
        <div class="space-y-8">
            <div class="flex items-center gap-3 px-2">
                <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <span class="text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-emerald-500">Stockify</span>
            </div>
            
            <nav class="space-y-2">
                <button onclick="switchPage('dashboard')" id="btn-dash" class="nav-btn active-nav w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold transition-all">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> ড্যাশবোর্ড
                </button>
                <button onclick="switchPage('products')" id="btn-prod" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-all">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> পণ্য তালিকা
                </button>
                <button onclick="switchPage('scanner')" id="btn-scan" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-all">
                    <i data-lucide="scan-barcode" class="w-5 h-5"></i> বারকোড স্ক্যানার
                </button>
                <button onclick="switchPage('settings')" id="btn-sett" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-all">
                    <i data-lucide="settings-2" class="w-5 h-5"></i> সেটিংস
                </button>
            </nav>
        </div>
        
        <div class="p-4 bg-slate-50 dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-700">
            <div class="flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase">ডার্ক মোড</span>
                </div>
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 flex items-center justify-center shadow-sm">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </aside>

    <nav class="md:hidden fixed bottom-4 left-4 right-4 h-16 glass-nav border border-white/20 dark:border-slate-700/50 rounded-2xl flex items-center justify-around z-50 shadow-2xl">
        <button onclick="switchPage('dashboard')" class="mobile-nav-btn text-primary flex flex-col items-center gap-1" data-page="dashboard">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] font-bold">হোম</span>
        </button>
        <button onclick="switchPage('products')" class="mobile-nav-btn text-slate-400 flex flex-col items-center gap-1" data-page="products">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i><span class="text-[10px] font-bold">পণ্য</span>
        </button>
        <div class="relative -mt-10">
            <button onclick="switchPage('scanner')" class="w-14 h-14 bg-primary text-white rounded-2xl shadow-xl shadow-primary/40 flex items-center justify-center border-4 border-slate-50 dark:border-slate-900">
                <i data-lucide="scan-line" class="w-6 h-6"></i>
            </button>
        </div>
        <button onclick="switchPage('settings')" class="mobile-nav-btn text-slate-400 flex flex-col items-center gap-1" data-page="settings">
            <i data-lucide="settings-2" class="w-5 h-5"></i><span class="text-[10px] font-bold">সেটিংস</span>
        </button>
    </nav>

    <main class="p-5 md:p-10 max-w-7xl mx-auto w-full">
        
        <section id="page-dashboard" class="page-view space-y-8">
            <header>
                <h1 class="text-3xl font-black tracking-tight">ওভারভিউ</h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium mt-1">আপনার স্টকের রিয়েল-টাইম আপডেট এখানে দেখুন।</p>
            </header>

            <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden group">
                    <div class="relative z-10 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">মোট প্রোডাক্ট</p>
                            <h3 id="dash-total" class="text-3xl font-black mt-2">0</h3>
                        </div>
                        <div class="w-14 h-14 rounded-2xl bg-primary/10 text-primary flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i data-lucide="package" class="w-7 h-7"></i>
                        </div>
                    </div>
                    <div class="absolute -bottom-6 -right-6 w-24 h-24 bg-primary/5 rounded-full"></div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden group">
                    <div class="relative z-10 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">মেয়াদ উত্তীর্ণ</p>
                            <h3 id="dash-expired" class="text-3xl font-black mt-2 text-red-500">0</h3>
                        </div>
                        <div class="w-14 h-14 rounded-2xl bg-red-500/10 text-red-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i data-lucide="alert-circle" class="w-7 h-7"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden group lg:col-span-1 sm:col-span-2">
                    <div class="relative z-10 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">মোট স্টক (পিস)</p>
                            <h3 id="dash-pieces" class="text-3xl font-black mt-2 text-blue-500">0</h3>
                        </div>
                        <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-500 flex items-center justify-center group-hover:scale-110 transition-transform">
                            <i data-lucide="layers" class="w-7 h-7"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-products" class="page-view space-y-8 hidden">
            <div id="products-list-view" class="space-y-6">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-black tracking-tight">স্টক ম্যানেজমেন্ট</h1>
                        <p class="text-slate-500 dark:text-slate-400 font-medium">পণ্য যোগ করুন ও ট্র্যাক করুন।</p>
                    </div>
                    <button onclick="openAddProductForm()" class="bg-primary hover:bg-darkPrimary text-white font-bold px-6 py-3.5 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-95">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> নতুন পণ্য যোগ করুন
                    </button>
                </div>

                <div class="flex flex-col lg:flex-row gap-4">
                    <div class="relative flex-1 group">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                        <input id="search-input" type="text" placeholder="নাম অথবা বারকোড দিয়ে খুঁজুন..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-12 pr-4 py-4 focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all shadow-sm">
                    </div>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                        <button class="bg-primary text-white px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap">সবগুলো</button>
                        <button class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-5 py-2 rounded-xl text-sm font-bold text-slate-500 whitespace-nowrap hover:border-primary transition-colors">Grains</button>
                        <button class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-5 py-2 rounded-xl text-sm font-bold text-slate-500 whitespace-nowrap hover:border-primary transition-colors">Dairy</button>
                    </div>
                </div>

                <div id="product-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                    </div>
            </div>

            <div id="products-form-view" class="max-w-2xl mx-auto hidden">
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="closeProductForm()" class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    </button>
                    <h1 id="form-title" class="text-2xl font-black">পণ্য এন্ট্রি ফরম</h1>
                </div>
                
                <div class="bg-white dark:bg-slate-800 p-8 rounded-[2rem] border border-slate-200 dark:border-slate-700 shadow-xl">
                    <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="hidden" id="form-id">
                        
                        <div class="md:col-span-2">
                            <div id="image-upload-wrapper" class="relative group">
                                <div id="image-preview-box" class="hidden relative aspect-video rounded-3xl overflow-hidden border-2 border-slate-100 dark:border-slate-700 shadow-inner">
                                    <img id="form-img-output" src="" class="w-full h-full object-cover">
                                    <button type="button" id="remove-img-btn" class="absolute top-4 right-4 w-10 h-10 bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 active:scale-90 transition-all">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                                    </button>
                                </div>
                                <label id="image-input-label" class="flex flex-col items-center justify-center aspect-video rounded-3xl border-2 border-dashed border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900/50 cursor-pointer hover:border-primary hover:bg-primary/5 transition-all group">
                                    <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl shadow-md flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                        <i data-lucide="image-plus" class="w-8 h-8 text-primary"></i>
                                    </div>
                                    <span class="font-bold text-slate-500">ছবির ফাইল সিলেক্ট করুন</span>
                                    <span class="text-xs text-slate-400 mt-1">PNG, JPG (Max 5MB)</span>
                                    <input type="file" id="form-image-input" accept="image/*" class="hidden">
                                </label>
                            </div>
                        </div>

                        <div class="md:col-span-2 space-y-1.5">
                            <label class="text-xs font-black text-slate-400 uppercase ml-1">পণ্যের নাম</label>
                            <input type="text" id="form-name" required placeholder="যেমন: চিনি ১ কেজি" class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none font-semibold">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-black text-slate-400 uppercase ml-1">বারকোড / SKU</label>
                            <div class="relative">
                                <input type="text" id="form-sku" required placeholder="স্ক্যান করুন..." class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none font-semibold">
                                <i data-lucide="barcode" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-black text-slate-400 uppercase ml-1">ক্যাটাগরি</label>
                            <select id="form-category" class="w-full px-5 py-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none font-semibold appearance-none">
                                <option value="Grains">Grains (শস্য)</option>
                                <option value="Dairy">Dairy (দুগ্ধজাত)</option>
                                <option value="Beverages">Beverages (পানীয়)</option>
                                <option value="Snacks">Snacks (নাস্তা)</option>
                            </select>
                        </div>

                        <div class="md:col-span-2 grid grid-cols-3 gap-4 bg-slate-50 dark:bg-slate-900/50 p-6 rounded-3xl border border-slate-100 dark:border-slate-700">
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase">কার্টুন</label>
                                <input type="number" id="form-cartons" value="0" class="w-full bg-transparent border-b-2 border-slate-200 dark:border-slate-700 focus:border-primary outline-none text-center text-lg font-bold">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase">পিস/কার্টুন</label>
                                <input type="number" id="form-pcs-per" value="10" class="w-full bg-transparent border-b-2 border-slate-200 dark:border-slate-700 focus:border-primary outline-none text-center text-lg font-bold">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-black text-primary uppercase">মোট পিস</label>
                                <input type="number" id="form-total-pcs" value="0" disabled class="w-full bg-transparent border-none outline-none text-center text-lg font-black text-primary">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-black text-emerald-600 dark:text-emerald-400 uppercase ml-1">কার্টুন মূল্য (৳)</label>
                            <input type="number" step="0.01" id="form-carton-price" value="0" class="w-full px-5 py-4 bg-emerald-50/30 dark:bg-emerald-500/5 border border-emerald-100 dark:border-emerald-500/20 rounded-2xl focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 outline-none font-bold text-emerald-700 dark:text-emerald-400">
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-black text-blue-600 dark:text-blue-400 uppercase ml-1">খুচরা মূল্য/পিস (৳)</label>
                            <input type="number" step="0.01" id="form-piece-price" value="0" class="w-full px-5 py-4 bg-blue-50/30 dark:bg-blue-500/5 border border-blue-100 dark:border-blue-500/20 rounded-2xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none font-bold text-blue-700 dark:text-blue-400">
                        </div>

                        <div class="md:col-span-2 space-y-1.5">
                            <label class="text-xs font-black text-red-500 uppercase ml-1">মেয়াদ উত্তীর্ণের তারিখ</label>
                            <input type="date" id="form-expiry" required class="w-full px-5 py-4 bg-red-50/30 dark:bg-red-500/5 border border-red-100 dark:border-red-500/20 rounded-2xl focus:ring-4 focus:ring-red-500/10 focus:border-red-500 outline-none font-bold">
                        </div>

                        <div class="md:col-span-2 flex gap-4 pt-4">
                            <button type="submit" class="flex-1 bg-primary text-white font-black py-4 rounded-2xl shadow-xl shadow-primary/20 hover:bg-darkPrimary transition-all active:scale-95">সেভ করুন</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <section id="page-scanner" class="page-view space-y-8 hidden">
            <div class="max-w-lg mx-auto text-center space-y-6">
                <header>
                    <h1 class="text-3xl font-black">বারকোড স্ক্যানার</h1>
                    <p class="text-slate-500 font-medium">ক্যামেরা দিয়ে পণ্য শনাক্ত করুন।</p>
                </header>
                
                <div class="relative w-full aspect-square bg-slate-900 rounded-[2.5rem] overflow-hidden shadow-2xl border-8 border-white dark:border-slate-800">
                    <div id="scanner-container" class="w-full h-full object-cover"></div>
                    
                    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-8">
                        <div class="flex justify-between items-center">
                            <div class="bg-red-500 w-3 h-3 rounded-full animate-ping"></div>
                            <span class="text-white text-[10px] font-black uppercase tracking-widest bg-black/40 px-3 py-1 rounded-full backdrop-blur-md">Live Scanner</span>
                        </div>
                        
                        <div class="w-full aspect-[4/3] border-2 border-primary/50 rounded-3xl relative">
                            <div class="absolute -inset-2 border-2 border-white/20 rounded-[2rem] animate-pulse"></div>
                            <div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
                            <div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
                            <div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
                            <div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
                        </div>

                        <div class="flex justify-center pointer-events-auto">
                            <button id="torch-btn" class="w-16 h-16 rounded-full bg-white/10 backdrop-blur-xl border border-white/20 text-white flex items-center justify-center hover:bg-white/20 transition-all shadow-xl">
                                <i data-lucide="flashlight" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Global Theme Toggle
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Apply saved theme
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Page Switcher
        window.switchPage = (pageId) => {
            document.querySelectorAll('.page-view').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            
            // UI Button Updates
            document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
                btn.classList.remove('active-nav', 'text-primary');
                btn.classList.add('text-slate-500', 'text-slate-400');
            });
            
            // Mark Active
            const desktopBtn = document.querySelector(`.nav-btn[onclick="switchPage('${pageId}')"]`);
            if(desktopBtn) desktopBtn.classList.add('active-nav');
            
            lucide.createIcons();
        }

        // Product Form Controls
        window.openAddProductForm = () => {
            document.getElementById('products-list-view').classList.add('hidden');
            document.getElementById('products-form-view').classList.remove('hidden');
            document.getElementById('form-title').innerText = "নতুন পণ্য যোগ করুন";
        }

        window.closeProductForm = () => {
            document.getElementById('products-form-view').classList.add('hidden');
            document.getElementById('products-list-view').classList.remove('hidden');
            document.getElementById('product-form').reset();
            document.getElementById('image-preview-box').classList.add('hidden');
            document.getElementById('image-input-label').classList.remove('hidden');
        }

        // Auto Calc Total Pcs
        const cartonsInp = document.getElementById('form-cartons');
        const pcsPerInp = document.getElementById('form-pcs-per');
        const totalPcsInp = document.getElementById('form-total-pcs');

        [cartonsInp, pcsPerInp].forEach(el => el.addEventListener('input', () => {
            totalPcsInp.value = (parseInt(cartonsInp.value) || 0) * (parseInt(pcsPerInp.value) || 0);
        }));

        lucide.createIcons();
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
