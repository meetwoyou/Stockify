<!DOCTYPE html>
<html lang="en" class="dark">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stockify Pro Ultra</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#16a34a"
      }
    }
  }
}
</script>

<style>
body{background:#020617;color:white;font-family:sans-serif}
.glass{background:rgba(15,23,42,.75);backdrop-filter:blur(20px)}
</style>

</head>

<body class="p-6">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
  <h1 class="text-3xl font-bold">Stockify</h1>
  <button onclick="openAddProductForm()" class="bg-green-500 text-black px-4 py-2 rounded-xl font-bold">
    + Add Product
  </button>
</div>

<!-- STATS -->
<div class="grid grid-cols-3 gap-4 mb-6">
  <div class="bg-slate-800 p-4 rounded-xl">
    Total: <span id="total">0</span>
  </div>
  <div class="bg-slate-800 p-4 rounded-xl">
    Products: <span id="count">0</span>
  </div>
  <div class="bg-slate-800 p-4 rounded-xl">
    Low Stock: <span id="low">0</span>
  </div>
</div>

<!-- PRODUCT GRID -->
<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

<!-- ADD PRODUCT MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">

  <div class="bg-slate-900 p-6 rounded-2xl w-full max-w-md space-y-3">

    <h2 class="text-xl font-bold">Add Product</h2>

    <input id="name" placeholder="Product Name" class="w-full p-2 rounded bg-slate-800">

    <input id="category" placeholder="Category" class="w-full p-2 rounded bg-slate-800">

    <input id="stock" type="number" placeholder="Stock" class="w-full p-2 rounded bg-slate-800">

    <input id="expiry" type="date" class="w-full p-2 rounded bg-slate-800">

    <!-- IMAGE UPLOAD -->
    <input type="file" id="image" accept="image/*" class="w-full">

    <img id="preview" class="hidden w-full h-40 object-cover rounded">

    <button onclick="saveProduct()" class="bg-green-500 text-black w-full py-2 rounded font-bold">
      Save
    </button>

    <button onclick="closeModal()" class="w-full py-2 bg-red-500 rounded font-bold">
      Cancel
    </button>

  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products") || "[]");

// IMAGE PREVIEW
document.getElementById("image").addEventListener("change", function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById("preview").src = reader.result;
    document.getElementById("preview").classList.remove("hidden");
  }
  reader.readAsDataURL(file);
});

// OPEN MODAL
function openAddProductForm(){
  document.getElementById("modal").classList.remove("hidden");
}

// CLOSE MODAL
function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

// SAVE PRODUCT
function saveProduct(){
  const name = document.getElementById("name").value;
  const category = document.getElementById("category").value;
  const stock = document.getElementById("stock").value;
  const expiry = document.getElementById("expiry").value;
  const image = document.getElementById("preview").src;

  const product = {
    name,
    category,
    stock,
    expiry,
    image: image || ""
  };

  products.push(product);
  localStorage.setItem("products", JSON.stringify(products));

  closeModal();
  render();
}

// RENDER PRODUCTS
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let low = 0;

  products.forEach(p => {
    if(Number(p.stock) < 5) low++;

    grid.innerHTML += `
      <div class="bg-slate-800 p-4 rounded-xl">
        <img src="${p.image}" class="w-full h-40 object-cover rounded mb-2"/>
        <h2 class="font-bold">${p.name}</h2>
        <p>${p.category}</p>
        <p>Stock: ${p.stock}</p>
        <p>Expiry: ${p.expiry}</p>
      </div>
    `;
  });

  document.getElementById("total").innerText = products.length;
  document.getElementById("count").innerText = products.length;
  document.getElementById("low").innerText = low;
}

render();
</script>

</body>
</html>
