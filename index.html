<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, visual-viewport-fit=cover">
    <title>Stockify Pro - Hybrid Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#10b981', dark: '#0f172a' } } }
        }
    </script>
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .nav-active { color: #10b981 !important; transform: scale(1.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input, select { background: rgba(15, 23, 42, 0.5) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
    </style>
</head>
<body class="text-slate-200">

    <main class="max-w-md mx-auto p-4 pb-28">
        <section id="page-dashboard" class="page-view space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-black text-white">Stockify <span class="text-primary text-xs uppercase">Hybrid</span></h1>
                    <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Real-time Cloud Sync</p>
                </div>
                <div class="w-10 h-10 rounded-full border-2 border-primary overflow-hidden shadow-lg shadow-primary/20">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Yash" alt="Profile">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-5 rounded-[2rem]">
                    <i data-lucide="package" class="w-5 h-5 text-primary mb-2"></i>
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Total Items</p>
                    <h3 id="dash-total" class="text-2xl font-black">0</h3>
                </div>
                <div class="glass p-5 rounded-[2rem]">
                    <i data-lucide="layers" class="w-5 h-5 text-amber-500 mb-2"></i>
                    <p class="text-[10px] font-bold text-slate-500 uppercase">Stock Pcs</p>
                    <h3 id="dash-pieces" class="text-2xl font-black">0</h3>
                </div>
            </div>
        </section>

        <section id="page-products" class="page-view hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Inventory</h2>
                <button onclick="openForm()" class="bg-primary p-3 rounded-2xl shadow-lg shadow-primary/20 active:scale-90 transition-transform">
                    <i data-lucide="plus" class="text-white"></i>
                </button>
            </div>
            <div class="glass flex items-center px-4 py-3 rounded-2xl">
                <i data-lucide="search" class="w-5 h-5 text-slate-500 mr-2"></i>
                <input id="search-input" type="text" placeholder="Search products..." class="bg-transparent border-none outline-none w-full text-sm">
            </div>
            <div id="product-grid" class="space-y-3"></div>
        </section>

        <section id="page-scanner" class="page-view hidden space-y-6">
            <div class="relative w-full aspect-square bg-black rounded-[3rem] overflow-hidden border-4 border-primary">
                <video id="scan-video" class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-[50px] border-black/40 pointer-events-none"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-32 border-2 border-primary rounded-xl animate-pulse"></div>
            </div>
            <p class="text-center text-xs text-slate-500 uppercase font-black">Point at barcode for instant sync</p>
        </section>

        <section id="page-settings" class="page-view hidden space-y-6">
            <div class="glass p-6 rounded-[2.5rem] text-center border-b-4 border-primary">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=YashKhan" class="w-20 h-20 mx-auto rounded-full bg-slate-800 p-1 mb-4 border-2 border-primary">
                <h2 class="text-xl font-black">Yash Khan</h2>
                <p class="text-primary text-xs font-bold uppercase tracking-widest">Lead Developer & Musician</p>
                <div class="flex justify-center gap-3 mt-4">
                    <div class="glass p-2 rounded-xl"><i data-lucide="github" class="w-4 h-4"></i></div>
                    <div class="glass p-2 rounded-xl"><i data-lucide="music" class="w-4 h-4"></i></div>
                </div>
            </div>
        </section>
    </main>

    <div id="form-overlay" class="fixed inset-0 z-[100] bg-dark hidden overflow-y-auto p-6">
        <div class="max-w-md mx-auto space-y-6 pb-10">
            <div class="flex justify-between items-center">
                <button onclick="closeForm()" class="glass p-3 rounded-2xl text-slate-400"><i data-lucide="x"></i></button>
                <h2 id="form-title" class="text-lg font-black uppercase tracking-widest">Entry Form</h2>
                <div class="w-10"></div>
            </div>

            <form id="product-form" class="space-y-5">
                <input type="hidden" id="form-id">
                
                <div onclick="document.getElementById('file-input').click()" class="h-48 glass rounded-[2rem] border-2 border-dashed border-white/10 flex items-center justify-center overflow-hidden relative cursor-pointer">
                    <img id="img-preview" class="hidden w-full h-full object-cover">
                    <div id="img-placeholder" class="text-center">
                        <i data-lucide="camera" class="w-8 h-8 text-primary mx-auto"></i>
                        <p class="text-[10px] font-bold mt-2 text-slate-500">UPLOAD PHOTO</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </div>

                <div class="space-y-4">
                    <input type="text" id="p-name" placeholder="Product Name" required class="w-full p-4 rounded-2xl outline-none focus:ring-2 ring-primary transition-all font-bold">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="p-sku" placeholder="SKU/Barcode" required class="p-4 rounded-2xl outline-none font-mono text-sm">
                        <select id="p-cat" class="p-4 rounded-2xl outline-none font-bold text-xs">
                            <option value="Beverages">Beverages</option>
                            <option value="Snacks">Snacks</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Toiletries">Toiletries</option>
                        </select>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 bg-primary/5 p-4 rounded-3xl border border-primary/10">
                        <div class="text-center">
                            <label class="text-[8px] font-black text-slate-500 uppercase">Cartons</label>
                            <input type="number" id="p-ctn" value="1" class="bg-transparent w-full text-center font-black text-lg outline-none">
                        </div>
                        <div class="text-center">
                            <label class="text-[8px] font-black text-slate-500 uppercase">Pcs/Ctn</label>
                            <input type="number" id="p-pcs-ctn" value="24" class="bg-transparent w-full text-center font-black text-lg outline-none">
                        </div>
                        <div class="text-center border-l border-white/10">
                            <label class="text-[8px] font-black text-primary uppercase">Total Pcs</label>
                            <input type="number" id="p-total" readonly class="bg-transparent w-full text-center font-black text-lg text-primary outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-500 ml-2">CTN PRICE (SAR)</label>
                            <input type="number" step="0.01" id="p-price-ctn" placeholder="0.00" class="w-full p-4 rounded-2xl outline-none font-bold">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-500 ml-2">PCS PRICE (SAR)</label>
                            <input type="number" step="0.01" id="p-price-pcs" placeholder="0.00" class="w-full p-4 rounded-2xl outline-none font-bold">
                        </div>
                    </div>

                    <input type="date" id="p-expiry" required class="w-full p-4 rounded-2xl outline-none font-bold uppercase text-xs">
                </div>

                <button type="submit" id="save-btn" class="w-full bg-primary py-5 rounded-[2rem] font-black text-white shadow-xl shadow-primary/20 active:scale-95 transition-all">
                    SYNC TO CLOUD & LOCAL
                </button>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 h-20 glass border-t-0 flex justify-around items-center rounded-t-[2.5rem] z-50 px-6">
        <button onclick="switchPage('dashboard')" class="nav-btn nav-active" data-id="dashboard"><i data-lucide="layout-dashboard"></i></button>
        <button onclick="switchPage('products')" class="nav-btn" data-id="products"><i data-lucide="box"></i></button>
        <button onclick="switchPage('scanner')" class="w-14 h-14 bg-primary rounded-full flex items-center justify-center -top-8 relative border-4 border-dark shadow-xl shadow-primary/30 active:scale-90 transition-transform"><i data-lucide="scan" class="text-white"></i></button>
        <button onclick="switchPage('settings')" class="nav-btn" data-id="settings"><i data-lucide="user"></i></button>
    </nav>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
