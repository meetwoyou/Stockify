<!DOCTYPE html>
<html lang="bn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, visual-viewport-fit=cover">
    <title>Stockify Pro - Sabbir Hosen Akash</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { primary: '#16a34a', darkBg: '#0f172a' } }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        .page-view { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen pb-20 md:pb-0 md:pl-64 transition-colors">

    <aside class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-6 flex-col justify-between z-40">
        <div class="space-y-8">
            <div class="flex flex-col">
                <span class="text-2xl font-black tracking-tighter text-green-600">STOCKIFY</span>
                <span class="text-[10px] font-bold text-slate-400 tracking-[0.2em]">BY SABBIR HOSEN</span>
            </div>
            <nav class="space-y-2">
                <button onclick="switchPage('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-bold bg-green-600 text-white shadow-lg shadow-green-600/20" data-page="dashboard">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </button>
                <button onclick="switchPage('products')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-slate-500 dark:text-slate-400" data-page="products">
                    <i data-lucide="box"></i> Inventory
                </button>
                <button onclick="switchPage('scanner')" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-2xl text-sm font-medium text-slate-500 dark:text-slate-400" data-page="scanner">
                    <i data-lucide="scan-line"></i> Smart Scan
                </button>
            </nav>
        </div>
    </aside>

    <main class="p-4 md:p-8 max-w-5xl mx-auto w-full">
        
        <section id="page-dashboard" class="page-view space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-black">Overview</h1>
                <div class="flex gap-2">
                    <div class="w-10 h-10 rounded-full border-2 border-green-500 p-0.5">
                        <img src="sabbir.jpg" class="w-full h-full rounded-full object-cover" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=Sabbir'">
                    </div>
                </div>
            </div>
            <div class="grid gap-4 grid-cols-2 lg:grid-cols-3">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Items</p>
                    <h3 id="dash-total" class="text-3xl font-black mt-1">0</h3>
                </div>
                <div class="bg-white dark:bg-slate-800 p-6 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Stock Pcs</p>
                    <h3 id="dash-pieces" class="text-3xl font-black mt-1 text-primary">0</h3>
                </div>
                <div onclick="switchPage('products'); renderProducts('expired')" class="bg-red-500/5 dark:bg-red-500/10 p-6 rounded-[2.5rem] shadow-sm border border-red-500/20 cursor-pointer active:scale-95 transition-all col-span-2 lg:col-span-1">
                    <p class="text-[10px] font-black text-red-500 uppercase">Expired Alert</p>
                    <h3 id="dash-expired" class="text-3xl font-black mt-1 text-red-600">0</h3>
                </div>
            </div>
        </section>

        <section id="page-products" class="page-view space-y-6 hidden">
            <div id="products-list-view" class="space-y-6">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-black">Stockify List</h1>
                    <button onclick="openAddProductForm()" class="bg-green-600 text-white p-4 rounded-2xl shadow-xl shadow-green-600/30 active:scale-90 transition-all">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-4 h-4 w-4 text-slate-400"></i>
                    <input id="search-input" oninput="renderProducts()" type="text" placeholder="Search by name or barcode..." class="w-full bg-white dark:bg-slate-800 border-none rounded-2xl pl-12 pr-4 py-4 text-sm shadow-sm focus:ring-2 ring-green-500 outline-none">
                </div>
                <div id="product-grid" class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                    </div>
            </div>

            <div id="products-form-view" class="max-w-xl mx-auto hidden">
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="closeProductForm()" class="p-3 bg-white dark:bg-slate-800 rounded-2xl shadow-sm"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-xl font-black uppercase">Entry Form</h2>
                </div>
                <form id="product-form" onsubmit="saveProduct(event)" class="space-y-5">
                    <input type="hidden" id="form-id">
                    
                    <div class="relative h-56 rounded-[3rem] overflow-hidden bg-slate-200 dark:bg-slate-800 border-4 border-white dark:border-slate-700 shadow-xl group">
                        <img id="form-img-output" class="absolute inset-0 w-full h-full object-cover hidden">
                        <div id="image-placeholder" class="flex flex-col items-center justify-center h-full">
                            <i data-lucide="camera" class="w-10 h-10 text-slate-400 mb-2"></i>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Capture or Upload</p>
                        </div>
                        <input type="file" accept="image/*" onchange="handleFormImage(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                    </div>

                    <div class="grid gap-4">
                        <input type="text" id="form-name" placeholder="Product Name" required class="w-full p-5 bg-white dark:bg-slate-800 rounded-2xl outline-none font-bold shadow-sm">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="form-sku" placeholder="Barcode / SKU" required class="p-5 bg-white dark:bg-slate-800 rounded-2xl font-mono text-sm shadow-sm">
                            <select id="form-category" class="p-5 bg-white dark:bg-slate-800 rounded-2xl font-bold text-sm shadow-sm outline-none">
                                <option value="Beverages">Beverages</option>
                                <option value="Bakery">Bakery</option>
                                <option value="Dairy">Dairy</option>
                                <option value="Frozen">Frozen</option>
                                <option value="Toiletries">Toiletries</option>
                                <option value="Snacks">Snacks</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-3 gap-2 bg-green-600/5 p-5 rounded-[2.5rem] border border-green-600/10">
                            <div class="text-center">
                                <label class="text-[8px] font-black text-slate-400 uppercase">Cartons</label>
                                <input type="number" id="form-cartons" value="0" oninput="calculateTotalPieces()" class="bg-transparent w-full text-center font-black text-xl outline-none">
                            </div>
                            <div class="text-center">
                                <label class="text-[8px] font-black text-slate-400 uppercase">Pcs/Ctn</label>
                                <input type="number" id="form-pcs-per" value="1" oninput="calculateTotalPieces()" class="bg-transparent w-full text-center font-black text-xl outline-none">
                            </div>
                            <div class="text-center">
                                <label class="text-[8px] font-black text-primary uppercase">Total</label>
                                <input type="number" id="form-total-pcs" readonly class="bg-transparent w-full text-center font-black text-xl text-primary outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" step="0.01" id="form-carton-price" placeholder="Ctn Price" oninput="calculatePrices('carton')" class="p-5 bg-white dark:bg-slate-800 rounded-2xl font-bold shadow-sm">
                            <input type="number" step="0.01" id="form-piece-price" placeholder="Pcs Price" oninput="calculatePrices('piece')" class="p-5 bg-white dark:bg-slate-800 rounded-2xl font-bold shadow-sm">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-4">Expiration Date</label>
                            <input type="date" id="form-expiry" required class="w-full p-5 bg-white dark:bg-slate-800 rounded-2xl font-bold shadow-sm">
                        </div>
                    </div>

                    <button type="submit" id="save-btn" class="w-full bg-green-600 text-white py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-xl shadow-green-600/30 active:scale-95 transition-all mt-4">
                        Save & Cloud Backup
                    </button>
                </form>
            </div>
        </section>

        <section id="page-scanner" class="page-view space-y-6 hidden">
            <div class="max-w-md mx-auto">
                <h1 class="text-2xl font-black mb-6">Smart Scanner</h1>
                <div class="relative aspect-square rounded-[3.5rem] overflow-hidden border-[6px] border-green-500 shadow-2xl bg-black">
                    <div id="scanner-container" class="w-full h-full"></div>
                    <div class="absolute inset-0 border-[50px] border-black/40 pointer-events-none"></div>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-40 border-2 border-green-500 rounded-3xl animate-pulse">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full bg-green-500 text-white text-[8px] font-black px-3 py-1 rounded-t-lg uppercase">Scanning...</div>
                    </div>
                </div>
                <button onclick="startScanner()" class="w-full mt-8 bg-white dark:bg-slate-800 p-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-sm">Initialize Camera</button>
            </div>
        </section>

        <section id="page-settings" class="page-view space-y-6 hidden text-center">
            <div class="bg-white dark:bg-slate-800 p-10 rounded-[3.5rem] shadow-sm border border-slate-100 dark:border-slate-700">
                <div class="w-24 h-24 mx-auto mb-4 border-4 border-green-500 rounded-full p-1">
                    <img src="sabbir.jpg" class="w-full h-full rounded-full object-cover" onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=Sabbir'">
                </div>
                <h2 class="text-2xl font-black">Sabbir Hosen Akash</h2>
                <p class="text-green-600 text-[10px] font-black uppercase tracking-widest mb-8">Lead System Architect</p>
                
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl">
                        <span class="text-xs font-bold text-slate-500">Dark Mode</span>
                        <button onclick="toggleTheme()" class="w-12 h-6 bg-slate-300 dark:bg-green-600 rounded-full relative transition-all">
                            <div class="absolute top-1 left-1 dark:left-7 w-4 h-4 bg-white rounded-full transition-all"></div>
                        </button>
                    </div>
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-500">Cloud Status</span>
                        <span class="text-[10px] font-black text-green-500 uppercase">Live & Secure</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 h-20 bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border-t border-slate-100 dark:border-slate-700 flex items-center justify-around z-50 px-6">
        <button onclick="switchPage('dashboard')" class="mobile-nav-btn text-green-600" data-page="dashboard"><i data-lucide="layout-dashboard"></i></button>
        <button onclick="switchPage('products')" class="mobile-nav-btn text-slate-400" data-page="products"><i data-lucide="box"></i></button>
        <button onclick="switchPage('scanner')" class="mobile-nav-btn text-slate-400" data-page="scanner"><i data-lucide="scan-line"></i></button>
        <button onclick="switchPage('settings')" class="mobile-nav-btn text-slate-400" data-page="settings"><i data-lucide="user"></i></button>
    </nav>

    <div id="details-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-center justify-center z-[100] p-6"></div>

    <script src="app.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
